const kclS=(nd,all,dis,hl,nt='$N_1$')=>({st:'KCL',kcl:1,hl,gen(){const ent=[],lea=[];all.forEach(id=>(enters(id,nd)?ent:lea).push(id));
const tx=id=>'I_'+BR[id].sym,sy=id=>'$'+tx(id)+'$',bank=[...all,...dis].map(sy).concat(['$+$','$+$','$=$','$0$']);
const side=a=>a.length?a.map(tx).join('+'):'0',eq=side(ent)+'='+side(lea);
const jn=a=>a.length?a.flatMap((id,j)=>j?['$+$',sy(id)]:[sy(id)]):['$0$'],seq=[...jn(ent),'$=$',...jn(lea)],used=new Set();

const $=id=>document.getElementById(id);const P=(()=>{try{const p=JSON.parse(localStorage.getItem('acl'));return{done:p.done||[],xp:p.xp||0}}catch(e){return{done:[],xp:0}}})();
let S,cs,PP,BR={},DIR={},locked=false,lastWrong=null,cur=0,i=0,xp=P.xp,streak=0,tries=0,sel=null,ans=[],done=false;const qa=$('qa'),go=$('go'),ft=$('ft');

(s.lbl||[]).forEach(([id,t])=>$(id).textContent=t);if(s.after)s.after();
ft.className='foot ok';$('msg').innerHTML=`<b>${real?['Nice!','Correct!','Great job!','You got it!'][i%4]:'Here’s the answer'}</b>${T(s.e)}${real&&!tries&&Array.isArray(s.w)&&s.w.find(Boolean)?`<div class="why">⚠ Common slip: ${T(s.w.find(Boolean))}</div>`:''}`;$('sa').style.display='none';
go.textContent=i===S.length-1?'Finish':'Continue';go.disabled=false;go.onclick=next}

let why='';if(s.w&&sel!==null&&sel!==undefined)why=s.w[sel]||'';else if(s.build){const g=ans.map(k=>s.build[k]);if(s.diag)why=s.diag(g);else{const nd=s.a.map(k=>s.build[k]),ex=g.filter(x=>!nd.includes(x)),ms=nd.filter(x=>!g.includes(x));why=ex.length?ex.join(' ')+' does not belong in this equation.':ms.length?'Still missing: '+ms.join(' ')+'.':'You have the right pieces, but the order is off. Read the equation left to right.'}}
