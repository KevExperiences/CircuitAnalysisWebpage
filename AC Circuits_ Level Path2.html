<style>

<script>
// "@" stands for a LaTeX backslash inside $...$
const T=s=>String(s).replace(/\$([^$]+)\$/g,(m,x)=>{x=x.replace(/@/g,'\\');try{return window.katex?katex.renderToString(x,{output:'mathml',throwOnError:false}):x}catch(e){return x}});

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=s=>{const r=s.gen?Object.assign({},s,s.gen(s)):Object.assign({},s);
if(Array.isArray(r.o)){const ix=shuf(r.o.map((_,k)=>k));r.o=ix.map(k=>r.o[k]);if(Array.isArray(r.w))r.w=ix.map(k=>r.w[k]);r.a=ix.indexOf(r.a)}
if(r.build){const ix=shuf(r.build.map((_,k)=>k));if(Array.isArray(r.a))r.a=r.a.map(x=>ix.indexOf(x));r.build=ix.map(k=>r.build[k])}
return r};
const enters=(id,n)=>{const B=BR[id],d=DIR[id];return(d===1&&B.b===n)||(d===-1&&B.a===n)};
function drawArrows(){const g=document.getElementById('arr');if(!g)return;g.innerHTML=Object.keys(DIR).filter(id=>BR[id]&&BR[id].p).map(id=>{const B=BR[id],d=DIR[id],x=B.p[0],y=B.p[1],vx=B.v[0]*d,vy=B.v[1]*d,px=-vy,py=vx,tx=x+vx*11,ty=y+vy*11,sx=x-vx*11,sy=y-vy*11;
return `<path d="M${sx} ${sy}L${tx} ${ty}M${tx-vx*7+px*4} ${ty-vy*7+py*4}L${tx} ${ty}L${tx-vx*7-px*4} ${ty-vy*7-py*4}" style="stroke:#ff9600;stroke-width:3;fill:none"/><text x="${B.lp[0]}" y="${B.lp[1]}" text-anchor="${B.lp[2]}" style="fill:#ff9600;font-weight:700">I<tspan font-size="10" dy="3">${B.sym}</tspan></text>`}).join('')}
const dirS=(nd,br,hl,nt='$N_1$')=>({st:'Directions',dir:1,nd,br,nt,hl,q:`Choose the direction of each current at ${nt}. You decide, and the next questions will follow your arrows.`,e:'Any choice works. If the real current flows the other way, its value simply comes out negative.'});
const kclS=(nd,all,dis,hl,nt='$N_1$')=>({st:'KCL',kcl:1,hl,gen(){const ent=[],lea=[];all.forEach(id=>(enters(id,nd)?ent:lea).push(id));
const tx=id=>'I_'+BR[id].sym,sy=id=>'$'+tx(id)+'$',bank=[...all,...dis].map(sy).concat(['$+$','$+$','$=$','$0$']);
const side=a=>a.length?a.map(tx).join('+'):'0',eq=side(ent)+'='+side(lea);
const jn=a=>a.length?a.flatMap((id,j)=>j?['$+$',sy(id)]:[sy(id)]):['$0$'],seq=[...jn(ent),'$=$',...jn(lea)],used=new Set();
const ix=seq.map(x=>{const k=bank.findIndex((y,j)=>y===x&&!used.has(j));used.add(k);return k});
const f=a=>a.filter(x=>x!=='$+$').sort().join('|'),E=f(ent.length?ent.map(sy):['$0$']),O=f(lea.length?lea.map(sy):['$0$']);
return{q:`Write KCL at ${nt} using your arrows: current entering = current leaving.`,build:bank,a:ix,chk:a=>{const i=a.indexOf('$=$');if(i<0)return false;const L=f(a.slice(0,i)),R=f(a.slice(i+1));return(L===E&&R===O)||(L===O&&R===E)},
diag:a=>{const i=a.indexOf('$=$');if(i<0)return 'Your equation needs an = sign: entering currents on one side, leaving currents on the other.';
const need=new Set([...ent,...lea].map(sy)),used=a.filter(x=>x[1]==='I'),ex=used.filter(x=>!need.has(x)),ms=[...need].filter(x=>!used.includes(x));
if(ex.length)return ex.join(', ')+' does not touch this node, so it does not belong in this equation.';
if(ms.length)return 'Your equation is missing '+ms.join(', ')+'. Every current at the node must appear once.';
return 'All the currents are there, but on the wrong sides. Arrows pointing toward the node go on one side, arrows pointing away on the other.'+(ent.length&&lea.length?'':' When every arrow points the same way, the other side is $0$.')},
h:'Currents entering a node equal currents leaving it. Check your arrows: which ones point toward the node?',e:`Entering = leaving: $${eq}$.`,rec:`$${eq}$`}}});
const ohmS=(id,hl)=>({st:'Ohm’s law',ohm:id,hl,f:'$I=@dfrac{V_{@mathrm{tail}}-V_{@mathrm{head}}}{Z}$',gen(){const B=BR[id],d=DIR[id],c=d===1?B.ex[0]:B.ex[1],tl=d===1?B.va:B.vb,hd=d===1?B.vb:B.va;
return{q:`Write $I_${B.sym}$ for your arrow, using Ohm’s law.`,o:[B.ex[0],B.ex[1],...B.dis].map(x=>`$I_${B.sym}=${x}$`),a:d===1?0:1,w:[0,1,2,3].map(j=>j===(d===1?0:1)?'':j===(d===1?1:0)?`That is the expression for the opposite arrow. Yours points from $${tl}$ to $${hd}$, so use tail minus head.`:`Use the voltages at both ends of the branch: $${tl}$ at the tail and $${hd}$ at the head.`),h:`Your arrow points from $${tl}$ to $${hd}$, so the drop is tail minus head.`,e:`$I_${B.sym}=${c}$.`,rec:`$I_${B.sym}=${c}$`}}});
const $=id=>document.getElementById(id);const P=(()=>{try{const p=JSON.parse(localStorage.getItem('acl'));return{done:p.done||[],xp:p.xp||0}}catch(e){return{done:[],xp:0}}})();
let S,cs,PP,BR={},DIR={},locked=false,lastWrong=null,cur=0,i=0,xp=P.xp,streak=0,tries=0,sel=null,ans=[],done=false;const qa=$('qa'),go=$('go'),ft=$('ft');
const hl=l=>document.querySelectorAll('svg g[data-c]').forEach(g=>g.classList.toggle('on',l.includes(g.dataset.c)));
function render(){const s=cs=mk(S[i]);locked=false;$('lesson').classList.remove('lk');tries=0;sel=null;ans=[];done=false;hl(s.hl);$('pb').style.width=(i/S.length*100)+'%';ft.className='foot';$('sa').style.display='none';go.textContent='Check';go.disabled=true;go.onclick=check;
document.querySelectorAll('.click').forEach(c=>{c.style.display=s.node?'':'none';c.classList.remove('sel')});
let h=`<div class="stage">${s.st} · ${i+1}/${S.length}</div><button class="hb" id="hb">💡 Hint</button><div class="q">${T(s.q)}</div>`;
if(s.f)h+=`<div class="f">${T(s.f)}</div>`;h+=`<div id="hint"></div>`;
if(s.dir)h+=s.br.map(id=>`<div class="dr"><div class="drl">${T('Direction of $I_'+BR[id].sym+'$')}</div><div class="drb"><button class="dro" data-b="${id}" data-v="in">${T('into '+s.nt)}</button><button class="dro" data-b="${id}" data-v="out">${T('out of '+s.nt)}</button></div></div>`).join('');
if(s.o)h+=s.o.map((o,k)=>`<button class="opt" data-k="${k}">${T(o)}</button>`).join('');
if(s.build)h+=`<div class="ans" id="ans"></div><div class="bank">${s.build.map((t,k)=>`<button class="chip" data-k="${k}">${T(t)}</button>`).join('')}</div>`;
qa.innerHTML=h;$('hb').onclick=()=>{$('hint').innerHTML=`<div class="hint">${T(cs.h)}</div>`};
qa.querySelectorAll('.dro').forEach(b=>b.onclick=()=>{if(done||locked)return;const id=b.dataset.b,B=BR[id],toward=b.dataset.v==='in';DIR[id]=(toward===(s.nd===B.b))?1:-1;
b.parentNode.querySelectorAll('.dro').forEach(x=>x.classList.toggle('sel',x===b));drawArrows();go.disabled=!s.br.every(k=>DIR[k])});
qa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done||locked)return;qa.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.k;go.disabled=false});

function drawAns(){const s=cs;if(!s.build)return;$('ans').innerHTML=ans.map((k,j)=>`<button class="chip" data-j="${j}">${T(s.build[k])}</button>`).join('');
$('ans').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(done||locked)return;ans.splice(+b.dataset.j,1);drawAns()});

function bindClicks(){document.querySelectorAll('.click').forEach(c=>c.onclick=()=>{const s=cs;if(!s.node||done||locked)return;document.querySelectorAll('.click').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c.dataset.n;go.disabled=false});}

function good(real){const s=cs;done=true;if(real){xp+=tries?5:10;streak++}else streak=0;$('xp').textContent='⚡ '+xp;$('st').textContent='🔥 '+streak;
if(s.o)qa.querySelectorAll('.opt').forEach((b,k)=>{b.classList.toggle('x',k!==s.a);if(k===s.a){b.classList.remove('sel');b.classList.add('y')}});
if(s.rec){const w=$('work');if(!w.dataset.f){w.innerHTML='';w.dataset.f=1}w.insertAdjacentHTML('beforeend',`<span>${T(s.rec)}</span>`);w.scrollLeft=1e4}
(s.lbl||[]).forEach(([id,t])=>$(id).textContent=t);if(s.after)s.after();
ft.className='foot ok';$('msg').innerHTML=`<b>${real?['Nice!','Correct!','Great job!','You got it!'][i%4]:'Here’s the answer'}</b>${T(s.e)}${real&&!tries&&Array.isArray(s.w)&&s.w.find(Boolean)?`<div class="why">⚠ Common slip: ${T(s.w.find(Boolean))}</div>`:''}`;$('sa').style.display='none';
go.textContent=i===S.length-1?'Finish':'Continue';go.disabled=false;go.onclick=next}
function bad(){lastWrong=sel;locked=true;$('lesson').classList.add('lk');tries++;streak=0;$('st').textContent='🔥 0';ft.className='foot no';const s=cs;
let why='';if(s.w&&sel!==null&&sel!==undefined)why=s.w[sel]||'';else if(s.build){const g=ans.map(k=>s.build[k]);if(s.diag)why=s.diag(g);else{const nd=s.a.map(k=>s.build[k]),ex=g.filter(x=>!nd.includes(x)),ms=nd.filter(x=>!g.includes(x));why=ex.length?ex.join(' ')+' does not belong in this equation.':ms.length?'Still missing: '+ms.join(' ')+'.':'You have the right pieces, but the order is off. Read the equation left to right.'}}
if(s.o&&sel!==null){const b=qa.querySelectorAll('.opt')[sel];if(b)b.classList.add('bad')}
$('msg').innerHTML=`<b>${tries>1?'Still not it':'Not quite'}</b>${why?`<div class="why">${T(why)}</div>`:''}<div class="tip">💡 ${T(s.h)}</div>`;go.textContent='Try again';go.onclick=retry;

function retry(){const s=cs;locked=false;$('lesson').classList.remove('lk');ft.className='foot';$('sa').style.display='none';go.textContent='Check';go.onclick=check;
if(s.o){qa.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));const b=qa.querySelectorAll('.opt')[lastWrong];if(b){b.classList.remove('bad');b.classList.add('x');b.disabled=true}sel=null;go.disabled=true}
else if(s.build){ans=[];drawAns()}else{document.querySelectorAll('.click').forEach(x=>x.classList.remove('sel'));sel=null;go.disabled=true}}

Object.assign(LV[1],{goal:'Solve circuits with dependent sources: a dependent current source (nodal analysis) or a dependent voltage source (mesh analysis). The circuit changes each time.',objs:['Choose between nodal and mesh analysis for the circuit','Identify what controls a dependent source','Substitute the control variable so the equation has one unknown','Solve the complex equation and interpret the result']});
Object.assign(LV[2],{goal:'Analyze an op-amp circuit with capacitor feedback. It may be inverting ($V_+=0$), non-inverting ($V_+=V_{in}$) or driven by two inputs.',objs:['Apply $V_-=V_+$ and recognize when $V_+$ is not zero','Write KCL at the inverting node with your own current directions','Derive the closed-loop gain for each configuration','Convert the phasor output to the time domain']});
